ンチで拡大 · 二本指で移動",homeAria:"東京の全景に戻る",viewTools:"表示ツール",statusDay:"昼 / Daylight",statusNight:"夜 / Night",tokyoTowerName:"東京タワー",tokyoTowerArea:"港区 · Minato",tokyoTowerShort:"東京タワー",tokyoTowerText:"一九五八年に建った鉄塔。芝公園の木々の上に、橙と白の格子が浮かびます。夜は内側から照らされます。",skytreeName:"東京スカイツリー",skytreeArea:"墨田区 · Sumida",skytreeShort:"スカイツリー",skytreeText:"隅田川の東に立つ、淡い三脚の塔。二つの円形展望台と長いアンテナが、盆の端からでも見えます。",sensojiName:"浅草寺",sensojiArea:"浅草 · Asakusa",sensojiShort:"浅草寺",sensojiText:"東京で最も古い寺。雷門の大提灯、仲見世の店、本堂の後ろには五重塔。朝の境内は静かです。",rainbowBridgeName:"レインボーブリッジ",rainbowBridgeArea:"お台場 · Odaiba",rainbowBridgeShort:"レインボー",rainbowBridgeText:"芝浦とお台場を結ぶ白い吊り橋。夜にはケーブルが灯り、下の海を水上バスが通ります。",shibuyaName:"渋谷スクランブル交差点",shibuyaArea:"渋谷 · Shibuya",shibuyaShort:"渋谷",shibuyaText:"五つの道が一度に交わる場所。二、三分ごとに斜めの白線が人で埋まり、角のスクリーンは夜も消えません。",meijiJinguName:"明治神宮",meijiJinguArea:"原宿 · Harajuku",meijiJinguShort:"明治神宮",meijiJinguText:"騒がしい交差点から少し歩いた、森の入口の木の鳥居。参道の砂利は毎朝ならされます。",imperialPalaceName:"皇居",imperialPalaceArea:"千代田 · Chiyoda",imperialPalaceShort:"皇居",imperialPalaceText:"濠に囲まれた、街の真ん中の静かな島。石垣、松、白い伏見櫓、そして二重橋。",shinjukuName:"新宿ツインタワー",shinjukuArea:"新宿 · Shinjuku",shinjukuShort:"新宿",shinjukuText:"都庁の二本の塔が西の空を支えています。下の小さな通りは、仕事が終わっても灯りが消えません。"},rE={en:aE,ja:sE};function oE(r){return r==="ja"||r==="jp"||r==="japanese"?"ja":"en"}const _r=new URLSearchParams(location.search),Gi={capture:_r.get("capture")==="1",embed:_r.get("embed")==="1",quality:_r.get("quality")==="low"||_r.get("quality")==="high"?_r.get("quality"):null,view:_r.get("view"),lang:oE(_r.get("lang"))},uS=matchMedia("(prefers-reduced-motion: reduce)").matches,lE=window.self!==window.top,Me=rE[Gi.lang];typeof document<"u"&&(document.documentElement.lang=Me.htmlLang,document.title=Me.title);const qn={city:null,handlers:null,selected:null,layout:"full",quality:"high"},Of=[];typeof window<"u"&&(window.addEventListener("error",r=>Of.push(String(r.message??r))),window.addEventListener("unhandledrejection",r=>Of.push(String(r.reason?.message??r.reason))));function um(){const r=qn.c
